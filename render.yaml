# Render Blueprint: one free web service. The database lives on Neon (free, does not expire).
# Render asks for DATABASE_URL when the Blueprint is created.
services:
  - type: web
    name: screening-care-loop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
